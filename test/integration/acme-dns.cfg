[general]
listen = "0.0.0.0:53"
protocol = "both"
domain = "acme.test"
nsname = "ns.acme.test"
nsadmin = "admin.acme.test"
records = [
    "acme.test. A 127.0.0.1",
    "acme.test. NS ns.acme.test.",
    "ns.acme.test. A 127.0.0.1",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "8081"
tls = "none"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
